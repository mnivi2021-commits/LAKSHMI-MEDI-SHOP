<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Lakshmi Safety Equipment">
  <defs>
    <mask id="ring">
      <rect width="100" height="100" fill="#fff"/>
      <circle cx="50" cy="58" r="27" fill="#000"/>
      <rect x="0" y="70" width="100" height="30" fill="#000"/>
    </mask>
  </defs>
  <!-- green gear (upper half) -->
  <g fill="#1ba34f" mask="url(#ring)">
    <circle cx="50" cy="58" r="36"/>
    <g>
      <rect x="42" y="12" width="16" height="16" rx="3"/>
      <rect x="42" y="12" width="16" height="16" rx="3" transform="rotate(45 50 58)"/>
      <rect x="42" y="12" width="16" height="16" rx="3" transform="rotate(-45 50 58)"/>
      <rect x="42" y="12" width="16" height="16" rx="3" transform="rotate(90 50 58)"/>
      <rect x="42" y="12" width="16" height="16" rx="3" transform="rotate(-90 50 58)"/>
    </g>
  </g>
  <!-- black safety helmet with green ridge and brim -->
  <path d="M26 68 C26 47 37 37 51 37 C65 37 75 47 76 62 L84 66 C86 67.5 85 70 82 70 L26 70 Z" fill="#111" stroke="#1ba34f" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M42 39.5 C50 45 53 54 53 67" fill="none" stroke="#1ba34f" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 39.5 C65 45 67 53 67 64" fill="none" stroke="#1ba34f" stroke-width="2" stroke-linecap="round"/>
  <path d="M26 66.5 H78" stroke="#1ba34f" stroke-width="1.6"/>
</svg>
